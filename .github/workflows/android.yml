name: Android build

# Every push builds a debug APK (uploaded as a workflow artifact) so compile
# errors show up immediately. Pushing a tag like v0.1.0 also builds a release
# APK and publishes it as a GitHub Release for sideloading.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: add these repo secrets to sign releases with your own key.
      # Without them release APKs are signed with the debug key.
      KEYSTORE_B64: ${{ secrets.NEXUS_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "NEXUS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NEXUS_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Decode signing key
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.keystore"
          echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/nexus.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk "nexus-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nexus-${{ github.ref_name }}.apk
          generate_release_notes: true
