name: Android build

# Every push builds a debug APK (uploaded as a workflow artifact) so compile
# errors show up immediately. Every push to main also builds a release APK
# and publishes it as a GitHub Release (v0.2.<run number>), so the newest
# build is always one tap away on the Releases page, phone browser included.
# Pushing your own v* tag does the same with that exact version.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Release version
        id: ver
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.2.${{ github.run_number }}"
          fi
          echo "NEXUS_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "NEXUS_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK
        if: steps.ver.outputs.tag != ''
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk "nexus-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nexus ${{ steps.ver.outputs.tag }}
          files: nexus-${{ steps.ver.outputs.tag }}.apk
          generate_release_notes: true
          make_latest: true
